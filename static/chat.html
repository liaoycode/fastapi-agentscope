<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>harness agent</title>
<link rel="icon" type="image/png" href="./favicon.png" />
<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ----- 左侧 sessions ----- */
  .sidebar {
    width: 300px;
    flex: 0 0 300px;
    background: #15181f;
    border-right: 1px solid #232830;
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid #232830;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-header .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .sidebar-header input {
    flex: 1;
    min-width: 0;
    background: #0f1115;
    color: #e6e6e6;
    border: 1px solid #2c323b;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
  }
  .sidebar-header input:focus { border-color: #4f8cff; }
  .sidebar-header button {
    background: #4f8cff;
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sidebar-header button:hover { background: #3a78e8; }
  .session-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .session-list::-webkit-scrollbar { width: 6px; }
  .session-list::-webkit-scrollbar-thumb { background: #2c323b; border-radius: 3px; }
  .session {
    padding: 12px 16px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background .12s;
    border-bottom: 1px solid #1d2129;
  }
  .session:hover { background: #1c2029; }
  .session.active {
    background: #1c2230;
    border-left-color: #4f8cff;
  }
  .session-preview {
    font-size: 13px;
    color: #e6e6e6;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 4px;
  }
  .session-meta {
    font-size: 11px;
    color: #7a8493;
    display: flex;
    gap: 8px;
  }
  .session-meta .badge {
    background: #2c323b;
    color: #a0a8b3;
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10px;
  }
  .session-meta .badge.summary { background: #3a4a3a; color: #8fbf8f; }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: #7a8493;
    font-size: 13px;
  }

  /* ----- 右侧 chat ----- */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  /* 初始/新会话:消息区隐藏,整列垂直居中 → 输入框跑到中间 */
  .chat.chat-empty {
    justify-content: center;
  }
  .chat.chat-empty .messages {
    display: none;
  }
  .chat-header {
    padding: 14px 24px;
    border-bottom: 1px solid #232830;
    display: flex;
    justify-content: space-between;
    align-items: center;
按钮    background: #0f1115;
  }
  .chat-header.hidden { display: none; }
  .chat-title {
    font-size: 14px;
    color: #e6e6e6;
  }
  .chat-title .sid {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7a8493;
    font-size: 11px;
    margin-left: 8px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #2c323b; border-radius: 4px; }
  .summary-banner {
    background: #1c2230;
    border-left: 3px solid #8fbf8f;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 12px;
    color: #a8c8a8;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
  }
  .summary-banner .label {
    color: #8fbf8f;
    font-weight: 600;
    margin-bottom: 6px;
  }
  /* 气泡居中,头像 absolute 贴气泡外侧 — 头像不参与对齐,只贴气泡 */
  .msg { position: relative; display: flex; justify-content: center; align-items: flex-start; margin-bottom: 16px; }
  .msg .bubble-wrap { width: 800px; min-width: 0; }
  .msg .avatar {
    position: absolute;
    top: 0;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }
  /* 气泡 800px 居中 → 左右边沿各距 msg 中线 400px;头像 32 + 12 间隙 = 44 */
  .msg.assistant .avatar { right: calc(50% + 412px); background: #2c323b; color: #e6e6e6; }
  .msg.user .avatar { left: calc(50% + 412px); background: #4f8cff; color: #fff; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 8px;
    background: #1a1e26;
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .msg.user .bubble { background: #232a38; }
  .msg.assistant .bubble { background: #1a1e26; }
  /* 用户消息里附带的文件 chip 行 */
  .msg-files { display: flex; flex-wrap: wrap; gap: 6px;
               margin-bottom: 8px; padding-bottom: 8px;
               border-bottom: 1px dashed #3a414b; }
  .msg-file-chip { background: #1c2230; border: 1px solid #2c323b;
                   border-radius: 4px; padding: 2px 8px;
                   font-size: 12px; color: #b8c1cf; }
  .msg .role {
    font-size: 11px;
    color: #7a8493;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .msg .content-text { white-space: pre-wrap; }
  .msg .md h1, .msg .md h2, .msg .md h3, .msg .md h4 {
    margin: 8px 0 6px; font-weight: 600; color: #e6e6e6;
  }
  .msg .md h1 { font-size: 18px; }
  .msg .md h2 { font-size: 16px; }
  .msg .md h3 { font-size: 14px; }
  .msg .md p { margin: 0 0 8px; }
  .msg .md p:last-child { margin-bottom: 0; }
  .msg .md a { color: #4f8cff; text-decoration: none; }
  .msg .md a:hover { text-decoration: underline; }
  .msg .md code {
    background: #0f1115; padding: 1px 5px; border-radius: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; color: #e0c08f;
  }
  .msg .md pre {
    background: #0f1115; padding: 10px 12px; border-radius: 6px;
    overflow-x: auto; margin: 6px 0; border: 1px solid #232830;
  }
  .msg .md pre code {
    background: transparent; padding: 0; color: #c9d1d9; font-size: 12.5px;
  }
  .msg .md ul, .msg .md ol { margin: 6px 0; padding-left: 22px; }
  .msg .md li { margin: 2px 0; }
  .msg .md blockquote {
    border-left: 3px solid #4f8cff; margin: 6px 0; padding: 2px 12px;
    color: #a0a8b3; background: #1a1e26;
  }
  .msg .md .confirm-prompt {
    color: #ff6b6b;
    font-weight: 500;
    margin: 6px 0;
    line-height: 1.6;
  }
  .msg .md table {
    border-collapse: collapse; margin: 6px 0; font-size: 13px;
  }
  .msg .md th, .msg .md td {
    border: 1px solid #2c323b; padding: 4px 8px;
  }
  .msg .md th { background: #1c2230; }
  .msg .md hr { border: 0; border-top: 1px solid #2c323b; margin: 8px 0; }
  .msg .md img { max-width: 100%; border-radius: 4px; }
  /* 工具调用/结果:默认收起,点 summary 展开 */
  .msg .tool-block {
    margin-top: 8px;
    background: #0f1115;
    border-radius: 4px;
    border-left: 2px solid #4f8cff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #a0c4ff;
    overflow-x: auto;
  }
  .msg .tool-block > summary {
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
  }
  .msg .tool-block[open] > summary {
    border-bottom: 1px solid #1c2029;
    padding-bottom: 6px;
  }
  .msg .tool-block .name { color: #4f8cff; font-weight: 600; }
  .msg .tool-block .args {
    color: #7a8493; padding: 8px 12px; white-space: pre-wrap;
  }
  .msg.streaming .bubble::after {
    content: '▍';
    color: #4f8cff;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* 输入框:跟气泡同宽 800px 居中对齐;发送按钮绝对定位浮在右下角,
     不参与水平对齐(否则会和气泡中线对齐时一起偏移/挤压 textarea)。
     底色沿用 body/messages 的 #0f1115,跟中间聊天区连成一片,
     不再单独一个色块。 */
  .input-area {
    padding: 16px 24px;
    background: #0f1115;
    display: flex;
    justify-content: center;
  }
  /* 输入区整体容器 —— 跟原 textarea 同样的边框/背景/圆角,chips 嵌在内部顶端 */
  .input-wrapper {
    width: 100%;
    max-width: 800px;
    background: #0f1115;
    border: 1px solid #2c323b;
    border-radius: 8px;
    transition: border-color .12s;
  }
  .input-wrapper:focus-within { border-color: #4f8cff; }
  /* 拖文件到输入框时高亮,提示"松手即可上传" */
  .input-wrapper.drag-over {
    border-color: #4f8cff;
    background: #1c2230;
  }
  .input-row {
    position: relative;
    width: 100%;
  }
  .input-row textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: transparent;
    color: #e6e6e6;
    border: 0;
    border-radius: 0;
    /* 右侧留出空间给 📎 和 发送 按钮,文字不会被按钮盖住 */
    padding: 10px 56px 10px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    resize: none;
    min-height: 100px;
    /* 不设 max-height,文字长了就让 textarea 直接拉高,不出滚动条 */
    overflow: hidden;
    outline: none;
  }
  .input-row button {
    position: absolute;
    right: 8px;
    bottom: 8px;
    background: transparent;
    color: #4f8cff;
    border: 0;
    border-radius: 6px;
    padding: 0;
    width: 24px;
    height: 28px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .input-row button:hover:not(:disabled) { color: #3a78e8; }
  .input-row button:disabled {
    color: #2c323b;
    cursor: not-allowed;
  }
  .input-row button svg {
    display: block;
    width: 14px;
    height: 14px;
  }
  /* 文件 chip 栏 —— 嵌在 .input-wrapper 顶部 */
  .chip-bar { display: flex; gap: 6px;
              padding: 8px 8px 0 8px;
              flex-wrap: wrap; max-height: 110px;
              overflow-y: auto; }
  /* 没有 chip 时整个区域不可见,避免占空白 */
  .chip-bar:empty { display: none; }
  .chip { background: #1c2230; border: 1px solid #2c323b; border-radius: 6px;
          padding: 3px 8px; font-size: 12px;
          display: inline-flex; gap: 6px; align-items: center;
          max-width: 220px; }
  .chip .name { overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; max-width: 160px; }
  .chip .x { cursor: pointer; color: #7a8493; font-weight: bold;
             line-height: 1; padding: 0 2px; }
  .chip .x:hover { color: #ff6b6b; }
  /* 上传中:加进度条,蓝色边框 */
  .chip.pending {
    border-color: #4f8cff;
    background: #1a2230;
  }
  .chip.pending .progress-bar {
    display: inline-block;
    width: 60px;
    height: 4px;
    background: #2c323b;
    border-radius: 2px;
    overflow: hidden;
    vertical-align: middle;
  }
  .chip.pending .progress-fill {
    display: block;
    height: 100%;
    background: #4f8cff;
    transition: width 0.15s ease-out;
  }
  .chip.pending .progress-text {
    color: #4f8cff;
    font-size: 11px;
    min-width: 30px;
    text-align: right;
  }
  /* 上传失败:红边框 + 红字 */
  .chip.error {
    border-color: #ff6b6b;
    background: #2a1a1a;
    color: #ff8a8a;
  }
  .chip.error .size { color: #ff8a8a; }
  .chip .size { color: #7a8493; margin-left: -2px; }
  .empty-chat {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7a8493;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <input id="apiBase" placeholder="后端地址" value="http://127.0.0.1:8000" />
      <div class="row">
        <input id="userId" placeholder="user_id" value="demo-user" />
        <button id="refreshBtn">刷新</button>
        <button id="newChatBtn">新会话</button>
      </div>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty">暂无会话</div>
    </div>
  </aside>

  <main class="chat chat-empty" id="chat">
    <div class="chat-header hidden" id="chatHeader">
      <div class="chat-title">
        <span id="chatTitle">选个会话开始</span>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-chat">← 左侧选个会话，或点 "新会话"</div>
    </div>
    <form class="input-area" id="inputForm">
      <div class="input-wrapper" id="inputWrapper">
        <div id="fileChipBar" class="chip-bar"></div>
        <div class="input-row">
          <textarea id="inputBox" placeholder="输入消息，回车发送，Shift+回车换行" rows="4"></textarea>
          <input type="file" id="filePicker" hidden multiple
                 accept=".xlsx,.xls,.csv,.txt,.md,.py,.json,.log" />
          <button id="fileBtn" type="button" class="icon-only"
                  title="上传文件" style="right: 32px;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.5498 9.75V5H6.9502V9.75C6.9502 10.3299 7.4201 10.7998 8 10.7998C8.5799 10.7998 9.0498 10.3299 9.0498 9.75V4.5C9.0498 2.9536 7.7964 1.7002 6.25 1.7002C4.7036 1.7002 3.4502 2.9536 3.4502 4.5V9.75C3.4502 12.2629 5.4871 14.2998 8 14.2998C10.5129 14.2998 12.5498 12.2629 12.5498 9.75V4H13.9502V9.75C13.9502 13.0361 11.2861 15.7002 8 15.7002C4.71391 15.7002 2.0498 13.0361 2.0498 9.75V4.5C2.04981 2.1804 3.9304 0.299806 6.25 0.299805C8.5696 0.299805 10.4502 2.1804 10.4502 4.5V9.75C10.4502 11.1031 9.3531 12.2002 8 12.2002C6.6469 12.2002 5.5498 11.1031 5.5498 9.75Z" fill="currentColor"></path></svg>
          </button>
          <button id="sendBtn" type="submit" class="icon-only" title="发送">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 2L8 13M8 2L3 7M8 2L13 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
        </div>
      </div>
    </form>
  </main>
</div>

<script>
(() => {
  // ---------- state ----------
  let currentSessionId = null;
  let activeStream = null;
  // 缓存会话列表(openSession 用它取 preview 作标题)
  let sessionsCache = [];
  // 当前 session 选中的文件:key=sessionId|'__new__',value=[{file_id,ext,filename,size}]
  const sessionFiles = new Map();

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const sessionList = $('sessionList');
  const messagesEl = $('messages');
  const inputBox = $('inputBox');
  const sendBtn = $('sendBtn');
  const fileBtn = $('fileBtn');
  const filePicker = $('filePicker');
  const fileChipBar = $('fileChipBar');
  const inputWrapper = $('inputWrapper');
  const inputForm = $('inputForm');
  const chatHeader = $('chatHeader');
  const chatTitle = $('chatTitle');
  const chatEl = $('chat');

  function setChatHeader(title) {
    chatTitle.textContent = title;
    chatHeader.classList.remove('hidden');
  }
  const newChatBtn = $('newChatBtn');
  const refreshBtn = $('refreshBtn');
  const userIdInput = $('userId');
  const apiBaseInput = $('apiBase');

  // 从输入框取后端 base URL（去掉尾部 /），持久化到 localStorage
  const apiBase = () => (apiBaseInput.value.trim().replace(/\/+$/, '') || 'http://127.0.0.1:8000');
  try {
    const saved = localStorage.getItem('apiBase');
    if (saved) apiBaseInput.value = saved;
  } catch (e) { /* localStorage 不可用时静默 */ }
  apiBaseInput.addEventListener('change', () => {
    try { localStorage.setItem('apiBase', apiBaseInput.value.trim()); } catch (e) {}
    loadSessions();
  });

  // ---------- helpers ----------
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Markdown -> HTML -> 净化。marked 配 GFM（GitHub Flavored Markdown），
  // breaks: true 让单个换行变 <br>（聊天场景常见）。DOMPurify 过滤
  // 危险标签/属性（script/onclick 等），但允许内联 HTML（b/i/span 等）。
  if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
    console.warn('[chat] marked 或 DOMPurify 未加载，markdown 将降级为纯文本');
  } else {
    console.log('[chat] marked + DOMPurify loaded');
  }
  function renderMarkdown(text) {
    if (!text) return '';
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
      // 库没加载（断网/慢），兜底成纯文本
      return `<div class="content-text">${escapeHtml(text)}</div>`;
    }
    const raw = marked.parse(text, { breaks: true, gfm: true });
    const safe = DOMPurify.sanitize(raw, {
      ADD_ATTR: ['target', 'rel'],
    });
    return `<div class="md">${safe}</div>`;
  }
  function relativeTime(iso) {
    const t = new Date(iso).getTime();
    const diff = Math.floor((Date.now() - t) / 1000);
    if (diff < 60) return `${diff}s 前`;
    if (diff < 3600) return `${Math.floor(diff/60)}m 前`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h 前`;
    return `${Math.floor(diff/86400)}d 前`;
  }

  // ---------- session list ----------
  async function loadSessions() {
    const userId = userIdInput.value.trim() || 'demo-user';
    try {
      const resp = await fetch(`${apiBase()}/agent/sessions?user_id=${encodeURIComponent(userId)}`);
      if (!resp.ok) { sessionList.innerHTML = '<div class="empty">加载失败</div>'; return; }
      const rows = await resp.json();
      sessionsCache = rows;
      if (rows.length === 0) {
        sessionList.innerHTML = '<div class="empty">暂无会话<br>点 "新会话" 开始</div>';
        return;
      }
      sessionList.innerHTML = rows.map(r => `
        <div class="session ${r.session_id === currentSessionId ? 'active' : ''}"
             data-sid="${escapeHtml(r.session_id)}">
          <div class="session-preview">${escapeHtml(r.preview || '(空)')}</div>
          <div class="session-meta">
            <span>${relativeTime(r.updated_at)}</span>
            <span class="badge">${r.message_count} 条</span>
            ${r.has_summary ? '<span class="badge summary">已压缩</span>' : ''}
          </div>
        </div>
      `).join('');
      sessionList.querySelectorAll('.session').forEach(el => {
        el.onclick = () => openSession(el.dataset.sid);
      });
    } catch (e) {
      sessionList.innerHTML = `<div class="empty">网络错误<br>${escapeHtml(String(e))}</div>`;
    }
  }

  // ---------- render messages ----------
  function renderMessage(msg) {
    const role = msg.role || 'user';
    const roleLabel = role === 'user' ? '你' : '助手';
    const avatar = role === 'user' ? 'U' : 'A';
    let inner = '';
    // 用户消息:把上传的文件渲染成 chip 行(在文本上方)
    if (role === 'user' && msg.files && msg.files.length) {
      inner += '<div class="msg-files">' + msg.files.map(f =>
        `<span class="msg-file-chip">📄 ${escapeHtml(f.original_name || f.filename || '')}</span>`
      ).join('') + '</div>';
    }
    for (const block of (msg.content || [])) {
      if (block.type === 'text') {
        // 文本块走 markdown + HTML 渲染；tool_* 块保持纯代码
        inner += renderMarkdown(block.text || '');
      } else if (block.type === 'tool_use' || block.type === 'tool_call') {
        inner += `<details class="tool-block">
          <summary>🔧 <span class="name">${escapeHtml(block.name || 'tool')}</span></summary>
          <div class="args">${escapeHtml(JSON.stringify(block.input || {}, null, 2))}</div>
        </details>`;
      } else if (block.type === 'tool_result') {
        inner += `<details class="tool-block">
          <summary>📋 <span class="name">${escapeHtml(block.name || 'tool')}</span> 结果</summary>
          <div class="args">${escapeHtml(String(block.output || '').slice(0, 500))}</div>
        </details>`;
      }
    }
    return `<div class="msg ${role}">
      <div class="avatar">${avatar}</div>
      <div class="bubble-wrap" style="min-width:0;">
        <div class="role">${roleLabel}</div>
        <div class="bubble">${inner || '<div class="content-text"></div>'}</div>
      </div>
    </div>`;
  }

  async function openSession(sid) {
    currentSessionId = sid;
    sessionList.querySelectorAll('.session').forEach(el => {
      el.classList.toggle('active', el.dataset.sid === sid);
    });
    setChatHeader(
      (sessionsCache.find(r => r.session_id === sid) || {}).preview || '新会话',
    );
    chatEl.classList.remove('chat-empty');
    renderChips();  // 切到历史会话:显示该 session 已上传的 chip
    messagesEl.innerHTML = '<div class="empty-chat">加载中...</div>';
    try {
      const resp = await fetch(`${apiBase()}/agent/sessions/${sid}/messages`);
      if (!resp.ok) throw new Error('加载失败');
      const data = await resp.json();
      renderHistory(data);
    } catch (e) {
      messagesEl.innerHTML = `<div class="empty-chat">${escapeHtml(String(e))}</div>`;
    }
  }

  function renderHistory(data) {
    let html = '';
    if (data.summary) {
      html += `<div class="summary-banner">
        <div class="label">📦 已压缩摘要（早期对话历史）</div>
        ${renderMarkdown(data.summary)}
      </div>`;
    }
    if (data.messages && data.messages.length) {
      html += data.messages.map(renderMessage).join('');
    } else {
      html += '<div class="empty-chat">空会话，发条消息开始吧</div>';
    }
    messagesEl.innerHTML = html;
    messagesEl.scrollTop = 0;
  }

  // ---------- send ----------
  function appendMessage(msg) {
    // 第一次发消息时清掉"← 发条消息开始"empty state,不然 DOM 里残留它,
    // scrollTop=scrollHeight 会钉在最下面,user 消息夹在中间被往上顶。
    const empty = messagesEl.querySelector('.empty-chat');
    if (empty) empty.remove();
    const tmp = document.createElement('div');
    tmp.innerHTML = renderMessage(msg);
    messagesEl.appendChild(tmp.firstElementChild);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return messagesEl.lastElementChild;
  }

  function appendStreamingBubble() {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant streaming';
    wrap.innerHTML = `<div class="avatar">A</div>
      <div class="bubble-wrap" style="min-width:0;">
        <div class="role">助手</div>
        <div class="bubble"></div>
      </div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap.querySelector('.bubble');
  }

  async function send(text) {
    const userId = userIdInput.value.trim() || 'demo-user';
    const payload = {
      user_id: userId,
      message: text,
    };
    if (currentSessionId) payload.session_id = currentSessionId;
    // 把当前 session 的 chip 文件一起带上 —— 后端会把路径告诉 LLM,让它自己分析
    const chips = sessionFiles.get(currentSessionKey()) || [];
    if (chips.length) {
      payload.file_metas = chips.map(c => ({
        file_id: c.file_id,
        ext: c.ext,
      }));
    }

    // append user msg(把当前 session 的 chip 文件也带上,渲染在对话气泡里)
    const userMsg = { role: 'user', content: [{ type: 'text', text }] };
    if (chips.length) userMsg.files = chips.map(c => ({
      file_id: c.file_id,
      ext: c.ext,
      filename: c.filename,
      original_name: c.original_name,
      size: c.size,
    }));
    appendMessage(userMsg);
    // 立即清掉当前 session 的 chip —— 文件已随消息发出,不让它继续占输入框
    sessionFiles.delete(currentSessionKey());
    renderChips();
    // 发出首条消息 → 切回正常布局(输入框落到底部,消息区填满)
    chatEl.classList.remove('chat-empty');

    // disable input
    sendBtn.disabled = true;
    inputBox.disabled = true;

    // open SSE
    const streamTarget = appendStreamingBubble();

    let buffer = '';
    const controller = new AbortController();
    const resp = await fetch(`${apiBase()}/agent/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal,
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let eventName = 'message';
    let dataLines = [];
    // 流式 markdown 渲染：每个 token 累积后整体重渲染（marked + DOMPurify）
    let streamText = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE: events separated by \r\n\r\n (SSE 规范), lines by \r\n
      // sse-starlette 默认用 CRLF,所以这里要按 \r\n\r\n 切,
      // 不能用 \n\n——CRLF 中间夹 \r 永远凑不出两个连续 LF
      let idx;
      while ((idx = buffer.indexOf('\r\n\r\n')) !== -1) {
        const rawEvent = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 4);
        eventName = 'message'; dataLines = [];
        for (const line of rawEvent.split('\r\n')) {
          if (line.startsWith('event:')) eventName = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
        }
        const data = dataLines.join('\n');
        if (eventName === 'session') {
          // 新会话(__new__)→ 真实 session_id:把 chip 从 '__new__' 迁过去
          if (currentSessionId === null && sessionFiles.has('__new__')) {
            sessionFiles.set(data, sessionFiles.get('__new__'));
            sessionFiles.delete('__new__');
          }
          currentSessionId = data;
          // 新会话尚无 preview,先用用户刚发的首句消息做标题,
          // 等 loadSessions 完成后会自动刷新成 server 端的 preview
          // 注:不能用 inputBox.value——表单提交时已被清空
          setChatHeader((text || '新会话').slice(0, 60));
          // refresh list
          loadSessions();
        } else if (eventName === 'error') {
          // error 的 data 也是 JSON:{"error": "...", "timestamp": "..."}
          let errMsg = data;
          try { errMsg = JSON.parse(data).error || data; } catch (_) { /* 兜底用原 data */ }
          streamTarget.innerHTML = `<div class="content-text">⚠ 错误：${escapeHtml(errMsg)}</div>`;
          break;
        } else if (data) {
          // data 是 JSON:{"event":"message","answer":"...","timestamp":"..."}——
          // 取 answer 拼到 streamText,timestamp 暂不消费(为以后分析留口子)
          let token = data;
          try {
            const obj = JSON.parse(data);
            if (obj && typeof obj.answer === 'string') token = obj.answer;
          } catch (_) { /* 非 JSON 就当纯文本,兜底 */}
          if (token) {
            streamText += token;
            streamTarget.innerHTML = renderMarkdown(streamText);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            // 让浏览器把当前帧画出来——不然一连串 token 累积，浏览器会
            // 合并多次重绘到下一帧，肉眼看到的就是"卡住不渲染"
            await new Promise(r => requestAnimationFrame(r));
          }
        }
      }
    }

    // done
    const bubble = streamTarget.closest('.msg');
    if (bubble) bubble.classList.remove('streaming');
    activeStream = null;
    sendBtn.disabled = false;
    inputBox.disabled = false;
    inputBox.focus();
    // refresh list to reflect new msg count / position
    await loadSessions();
    // 不要 openSession 重渲染：ask 提示（"⚠️ 工具 X 需要您确认..."）
    // 只在流里发过，没写进 server state.context，重渲染会被覆盖掉。
    // 用户需要点左侧会话名手动刷新看历史。
  }

  // ---------- events ----------
  inputForm.onsubmit = (e) => {
    e.preventDefault();
    const text = inputBox.value.trim();
    // 没有文字也行 —— 只要当前 session 有 chip 文件就能发
    const hasChips = (sessionFiles.get(currentSessionKey()) || []).length > 0;
    if (!text && !hasChips) return;
    inputBox.value = '';
    autoSize();
    send(text);
  };
  function autoSize() {
    // 不再截断在 200px:让 textarea 跟内容一起长,配合 CSS 里
    // overflow:hidden 不出滚动条,实现"文字多了直接拉高"。
    inputBox.style.height = 'auto';
    inputBox.style.height = inputBox.scrollHeight + 'px';
  }
  inputBox.oninput = autoSize;
  inputBox.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      inputForm.requestSubmit();
    }
  };

  newChatBtn.onclick = () => {
    currentSessionId = null;
    chatHeader.classList.add('hidden');
    chatEl.classList.add('chat-empty');
    messagesEl.innerHTML = '<div class="empty-chat">← 发条消息开始</div>';
    renderChips();  // 新会话 chip 区为空(只显示当前 session 已上传的)
  };
  refreshBtn.onclick = () => { loadSessions(); };
  userIdInput.onchange = () => { loadSessions(); };

  // ---------- file 上传 / chip ----------

  function currentSessionKey() {
    return currentSessionId || '__new__';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }

  function renderChips() {
    const k = currentSessionKey();
    const files = sessionFiles.get(k) || [];
    fileChipBar.innerHTML = files.map(f => {
      // 上传中:进度条 + 百分比,禁用删除
      if (f.pending) {
        const pct = f.progress || 0;
        return `<span class="chip pending">
          📄 ${escapeHtml(f.original_name || f.filename)}
          <span class="size">(${formatSize(f.size)})</span>
          <span class="progress-bar"><span class="progress-fill" style="width:${pct}%"></span></span>
          <span class="progress-text">${pct}%</span>
        </span>`;
      }
      // 上传失败:红字 + 错误信息
      if (f.error) {
        return `<span class="chip error" title="${escapeHtml(f.error_msg || '')}">
          ⚠ ${escapeHtml(f.original_name || f.filename)}
          <span class="size">(上传失败)</span>
          <span class="x" data-id="${f.file_id}">×</span>
        </span>`;
      }
      // 上传成功
      return `<span class="chip">📄 ${escapeHtml(f.original_name || f.filename)}
         <span class="size">(${formatSize(f.size)})</span>
         <span class="x" data-id="${f.file_id}">×</span></span>`;
    }).join('');
    fileChipBar.querySelectorAll('.x').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.id;
        sessionFiles.set(k, files.filter(f => f.file_id !== id));
        renderChips();
      };
    });
  }

  fileBtn.onclick = () => filePicker.click();
  filePicker.onchange = async (e) => {
    await uploadFiles(e.target.files);
    e.target.value = '';  // 允许重传同名
  };

  // 拖文件到输入框直接上传
  ['dragenter', 'dragover'].forEach(evt =>
    inputWrapper.addEventListener(evt, (e) => {
      e.preventDefault();
      e.stopPropagation();
      inputWrapper.classList.add('drag-over');
    }),
  );
  ['dragleave', 'dragend'].forEach(evt =>
    inputWrapper.addEventListener(evt, (e) => {
      // 只有真正离开 wrapper 才清高亮 —— 子元素触发也会冒泡,要判断 relatedTarget
      if (!inputWrapper.contains(e.relatedTarget)) {
        inputWrapper.classList.remove('drag-over');
      }
    }),
  );
  inputWrapper.addEventListener('drop', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    inputWrapper.classList.remove('drag-over');
    const files = e.dataTransfer ? e.dataTransfer.files : null;
    if (files && files.length) await uploadFiles(files);
  });

  async function uploadFiles(files) {
    // 每次上传现取 userId —— 不能用 send() 内的局部 const
    const userId = userIdInput.value.trim() || 'demo-user';
    for (const f of files) {
      const fd = new FormData();
      fd.append('file', f);
      fd.append('user_id', userId);

      // 上传中先占一个"进度 chip", 完成后转正 / 失败时换错误样式
      const tempId = '__pending_' + Math.random().toString(36).slice(2);
      const k = currentSessionKey();
      if (!sessionFiles.has(k)) sessionFiles.set(k, []);
      sessionFiles.get(k).push({
        file_id: tempId,
        pending: true,
        filename: f.name,
        original_name: f.name,
        size: f.size,
        progress: 0,
      });
      renderChips();

      try {
        const meta = await xhrUpload(`${apiBase()}/file/upload`, fd, (pct) => {
          const list = sessionFiles.get(k) || [];
          const item = list.find(x => x.file_id === tempId);
          if (item) {
            item.progress = pct;
            renderChips();
          }
        });
        // 成功:把占位 chip 换成真 meta
        const list = sessionFiles.get(k) || [];
        const idx = list.findIndex(x => x.file_id === tempId);
        if (idx >= 0) {
          list.splice(idx, 1, {
            file_id: meta.file_id,
            ext: meta.ext,
            filename: meta.filename,
            original_name: meta.filename,
            size: meta.size,
          });
          renderChips();
        }
      } catch (err) {
        // 失败:占位 chip 换成 error 态(留 5s 后自动消失)
        const list = sessionFiles.get(k) || [];
        const idx = list.findIndex(x => x.file_id === tempId);
        if (idx >= 0) {
          const item = list[idx];
          item.error = true;
          item.error_msg = err.message || String(err);
          renderChips();
          setTimeout(() => {
            const cur = sessionFiles.get(k) || [];
            const i = cur.findIndex(x => x.file_id === tempId && x.error);
            if (i >= 0) {
              cur.splice(i, 1);
              renderChips();
            }
          }, 5000);
        }
      }
    }
  }

  // 用 XHR 而不是 fetch —— fetch 没原生进度事件
  function xhrUpload(url, fd, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && onProgress) {
          onProgress(Math.round(e.loaded / e.total * 100));
        }
      };
      xhr.onload = () => {
        let body = null;
        try { body = JSON.parse(xhr.responseText); } catch (_) { /* 留 null */ }
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(body);
        } else {
          reject(new Error((body && body.message) || `HTTP ${xhr.status}`));
        }
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.onabort = () => reject(new Error('已取消'));
      xhr.send(fd);
    });
  }

  // initial
  loadSessions();
})();
</script>
</body>
</html>
